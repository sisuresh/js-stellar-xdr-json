[package]
name = "stellar-xdr-json"
version = "26.0.0"
edition = "2021"
publish = false
repository = "https://github.com/stellar/js-stellar-xdr-json"
rust-version = "1.86.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
schemars = "0.8.16"
serde_json = "1.0.114"
console_error_panic_hook = { version = "0.1.7", optional = true }
# TODO: For use with generating native values.
# serde-wasm-bindgen = "0.6.5"

# Protocol 28 (CAP-0084) pre-release: per-cap-feature layout, no 'curr' module.
# Pinned to rs-stellar-xdr#548 (bd30d420ce6f63ccd9360e371830384cb84d1c04), whose
# xdr submodule is stellar-xdr#305 head (2769fed744c4ec5a2cf6581addfc1704abfcba7c).
# cap_0083 + cap_0084 enable the muxed-contract-address (SC_ADDRESS_TYPE_MUXED_CONTRACT)
# arm on the SCAddress union, mirroring the CAP-0083 gating.
[dependencies.stellar-xdr]
version = "27.0.0"
git = "https://github.com/stellar/rs-stellar-xdr"
rev = "bd30d420ce6f63ccd9360e371830384cb84d1c04"
features = ["std", "type_enum", "cap_0083", "cap_0084", "base64", "serde", "serde_json", "schemars"]

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.dev]
opt-level = "z"
debug = 0
strip = "symbols"

[profile.release]
opt-level = "z"
debug = 0
strip = "symbols"
debug-assertions = false

[package.metadata.wasm-pack.profile.release]
# wasm-opt disabled — local binaryen may reject the bulk-memory ops emitted by
# the rs-stellar-xdr @ bd30d420 pre-release dep. Output is unoptimized but
# functionally correct. Re-enable once the pinned rev lands a release build.
wasm-opt = false
